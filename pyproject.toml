[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "velo-base"
version = "1.0.0"
description = "Velo Base 1.0 — efficient typed-decision specialist (HGBR + SVD), refittable base"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Santhosh Reddy" },
]
keywords = ["typed-decisions", "calibration", "sklearn", "specialist", "velo"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.20.0",
  "datasets>=2.14.0",
  "huggingface_hub>=0.20.0",
  "scikit-learn>=1.3.0",
  "safetensors>=0.4.0",
  "tqdm>=4.65.0",
  "pyarrow>=12.0.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# torch is not required for the production hybrid checkpoint (sklearn HGBR).
train = ["torch>=2.0.0"]

[project.scripts]
velo-infer = "velo_base.cli:main"

[tool.setuptools.packages.find]
include = ["velo_base*"]
